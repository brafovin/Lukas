<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lukas&Co – Streetwear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a0a0a; --white:#ffffff; --grey:#8a8a8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--black); color:var(--white); font-family:'Permanent Marker',cursive; line-height:1.4; }
  button { font-family:inherit; cursor:pointer; }
  nav { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--black); border-bottom:2px solid #222; }
  nav .brand { font-size:24px; color:var(--white); text-decoration:none; }
  .cartbtn { background:none; border:2px solid var(--white); color:var(--white); padding:8px 16px; font-size:18px; }
  .cartbtn:hover { background:var(--white); color:var(--black); }
  header { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 16px; }
  .logo { font-size:clamp(56px,16vw,200px); letter-spacing:.02em; line-height:1; transform:rotate(-4deg); }
  .tag { margin-top:24px; font-size:clamp(16px,3vw,26px); color:var(--grey); }
  .btn { margin-top:32px; display:inline-block; padding:14px 32px; border:3px solid var(--white); background:none; color:var(--white); text-decoration:none; font-size:20px; transition:.2s; }
  .btn:hover { background:var(--white); color:var(--black); }
  section { max-width:1100px; margin:0 auto; padding:64px 16px; }
  h2 { font-size:clamp(32px,6vw,56px); margin-bottom:32px; transform:rotate(-1.5deg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:24px; }
  .card { border:2px solid #222; padding:16px; text-align:center; }
  .card svg { width:100%; height:auto; }
  .card h3 { margin-top:12px; font-size:22px; }
  .card p { color:var(--grey); font-size:18px; }
  .price { color:var(--white)!important; font-size:24px!important; margin:4px 0 12px; }
  .sizes { display:flex; justify-content:center; gap:6px; margin-bottom:12px; }
  .sizes button { width:40px; height:40px; background:none; border:2px solid #444; color:var(--white); font-size:16px; }
  .sizes button.on { background:var(--white); color:var(--black); border-color:var(--white); }
  .add { width:100%; padding:12px; background:var(--white); color:var(--black); border:none; font-size:18px; }
  .add:hover { background:#ddd; }
  .palette { display:flex; gap:16px; flex-wrap:wrap; }
  .sw { width:140px; height:140px; display:flex; align-items:flex-end; padding:10px; font-size:16px; border:2px solid #333; }
  .sw.b { background:var(--black); }
  .sw.w { background:var(--white); color:var(--black); }
  footer { text-align:center; padding:48px 16px; color:var(--grey); border-top:2px solid #222; }
  /* Warenkorb */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; z-index:9; }
  #overlay.open { display:block; }
  #drawer { position:fixed; top:0; right:0; height:100%; width:min(400px,100%); background:#111; border-left:2px solid #333; padding:20px 16px; transform:translateX(100%); transition:.25s; z-index:10; display:flex; flex-direction:column; }
  #drawer.open { transform:none; }
  #drawer h2 { font-size:32px; margin-bottom:16px; transform:none; }
  #items { flex:1; overflow:auto; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid #333; font-size:17px; }
  .row small { color:var(--grey); display:block; }
  .qty button { width:28px; height:28px; background:none; border:2px solid #555; color:var(--white); }
  .qty span { margin:0 6px; }
  .total { display:flex; justify-content:space-between; font-size:24px; padding:16px 0; }
  .close { position:absolute; top:12px; right:16px; background:none; border:none; color:var(--white); font-size:28px; }
  .empty { color:var(--grey); padding:24px 0; }
  #msg { color:#7CFC7C; margin-top:8px; min-height:1.4em; }
</style>
</head>
<body>

<nav>
  <a class="brand" href="#">Lukas&amp;Co</a>
  <button class="cartbtn" id="openCart">Warenkorb (<span id="count">0</span>)</button>
</nav>

<header>
  <div class="logo">Lukas&amp;Co</div>
  <p class="tag">Streetwear. Schwarz. Laut.</p>
  <a class="btn" href="#shop">Zum Shop</a>
</header>

<section id="shop">
  <h2>Drop 01</h2>
  <div class="grid" id="products"></div>
</section>

<section>
  <h2>Brand Guide</h2>
  <div class="palette">
    <div class="sw b">Schwarz #0A0A0A</div>
    <div class="sw w">Weiß #FFFFFF</div>
  </div>
  <p style="margin-top:24px;font-size:20px">Schrift: Permanent Marker (Graffiti, gut lesbar).<br>
  Regel: Textilien immer schwarz, Logo/Prints immer weiß.</p>
</section>

<footer>© Lukas&amp;Co</footer>

<div id="overlay"></div>
<aside id="drawer" aria-label="Warenkorb">
  <button class="close" id="closeCart" aria-label="Schließen">×</button>
  <h2>Warenkorb</h2>
  <div id="items"></div>
  <div class="total"><span>Summe</span><span id="sum">0,00 €</span></div>
  <button class="add" id="checkout">Zur Kasse</button>
  <div id="msg"></div>
</aside>

<script>
const PRODUCTS = [
  { id:'tee',    name:'Classic Tee', price:29.90, sizes:['S','M','L','XL'],
    svg:'<path d="M60 10 L10 45 L30 85 L50 75 L50 210 L150 210 L150 75 L170 85 L190 45 L140 10 Q100 35 60 10Z" fill="#111" stroke="#333" stroke-width="2"/><text x="100" y="125" text-anchor="middle" font-family="Permanent Marker,cursive" font-size="24" fill="#fff">Lukas&amp;Co</text>' },
  { id:'hoodie', name:'Hoodie',      price:59.90, sizes:['S','M','L','XL'],
    svg:'<path d="M65 10 Q100 40 135 10 L185 50 L170 100 L150 90 L150 210 L50 210 L50 90 L30 100 L15 50Z" fill="#111" stroke="#333" stroke-width="2"/><path d="M65 10 Q100 60 135 10" fill="none" stroke="#333" stroke-width="2"/><text x="100" y="140" text-anchor="middle" font-family="Permanent Marker,cursive" font-size="24" fill="#fff">Lukas&amp;Co</text>' },
  { id:'cap',    name:'Cap',         price:24.90, sizes:['One Size'],
    svg:'<path d="M30 130 Q30 40 100 40 Q170 40 170 130Z" fill="#111" stroke="#333" stroke-width="2"/><path d="M20 130 Q100 110 190 145 Q100 150 20 130Z" fill="#111" stroke="#333" stroke-width="2"/><text x="100" y="105" text-anchor="middle" font-family="Permanent Marker,cursive" font-size="18" fill="#fff">L&amp;Co</text>' }
];
const eur = n => n.toFixed(2).replace('.', ',') + ' €';
const $ = id => document.getElementById(id);
let cart = [];
try { cart = JSON.parse(localStorage.getItem('lukasco-cart')) || []; } catch (e) {}
const save = () => { try { localStorage.setItem('lukasco-cart', JSON.stringify(cart)); } catch (e) {} };
const chosen = {};

$('products').innerHTML = PRODUCTS.map(p => {
  chosen[p.id] = p.sizes[p.sizes.length > 1 ? 1 : 0];
  return `<div class="card">
    <svg viewBox="0 0 200 220" aria-label="${p.name}">${p.svg}</svg>
    <h3>${p.name}</h3>
    <p>Schwarz · Logo weiß</p>
    <p class="price">${eur(p.price)}</p>
    <div class="sizes" data-id="${p.id}">${p.sizes.map(s => `<button class="${s === chosen[p.id] ? 'on' : ''}" style="${s.length > 2 ? 'width:auto;padding:0 10px' : ''}">${s}</button>`).join('')}</div>
    <button class="add" data-add="${p.id}">In den Warenkorb</button>
  </div>`;
}).join('');

document.querySelectorAll('.sizes').forEach(box => box.addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  box.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on');
  chosen[box.dataset.id] = e.target.textContent;
}));
document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
  const id = b.dataset.add, size = chosen[id];
  const line = cart.find(l => l.id === id && l.size === size);
  line ? line.qty++ : cart.push({ id, size, qty:1 });
  render(); openCart();
}));

function render() {
  const total = cart.reduce((s, l) => s + l.qty * PRODUCTS.find(p => p.id === l.id).price, 0);
  $('count').textContent = cart.reduce((s, l) => s + l.qty, 0);
  $('sum').textContent = eur(total);
  $('items').innerHTML = cart.length ? cart.map((l, i) => {
    const p = PRODUCTS.find(p => p.id === l.id);
    return `<div class="row"><div>${p.name}<small>${l.size} · ${eur(p.price)}</small></div>
      <div class="qty"><button data-q="${i}" data-d="-1">−</button><span>${l.qty}</span><button data-q="${i}" data-d="1">+</button></div></div>`;
  }).join('') : '<p class="empty">Dein Warenkorb ist leer.</p>';
  save();
}
$('items').addEventListener('click', e => {
  const i = e.target.dataset.q; if (i === undefined) return;
  cart[i].qty += +e.target.dataset.d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  render();
});
const openCart = () => { $('drawer').classList.add('open'); $('overlay').classList.add('open'); };
const closeCart = () => { $('drawer').classList.remove('open'); $('overlay').classList.remove('open'); };
$('openCart').onclick = openCart; $('closeCart').onclick = closeCart; $('overlay').onclick = closeCart;
$('checkout').onclick = () => {
  $('msg').textContent = cart.length ? 'Demo: Bezahlung ist noch nicht angebunden.' : 'Der Warenkorb ist leer.';
};
render();
</script>
</body>
</html>
