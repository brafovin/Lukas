<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUKAS &amp; CO – Logo-Entwürfe</title>
<style>
  :root { --bg:#0e0e0e; --fg:#f2efe8; --muted:#8d8a83; --accent:#ff5b1f; --card:#f2efe8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Helvetica Neue",Arial,sans-serif; padding:32px 20px 60px; }
  h1 { text-align:center; font-size:26px; letter-spacing:.15em; }
  p.sub { text-align:center; color:var(--muted); margin:8px 0 32px; }
  .grid { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  figure { background:var(--card); color:#111; aspect-ratio:1; display:flex; flex-direction:column; }
  figure.dark { background:#111; color:var(--fg); border:1px solid #333; }
  svg { flex:1; width:100%; min-height:0; }
  figcaption { padding:10px 14px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; background:rgba(0,0,0,.08); }
  figure.dark figcaption { background:#1c1c1c; color:var(--muted); }
  .serif { font-family:Georgia,"Times New Roman",serif; }
  .script { font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive; }
  .block { font-family:Impact,"Arial Black",sans-serif; }
</style>
</head>
<body>
